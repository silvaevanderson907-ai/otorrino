<!DOCTYPE html>
<html>
<head>
  <title>Favicon Hospital</title>
</head>
<body>
  <svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
    <!-- Fundo branco -->
    <rect width="32" height="32" fill="#ffffff"/>
    <!-- Borda da clínica -->
    <rect x="2" y="2" width="28" height="28" fill="none" stroke="#0d6efd" stroke-width="2" rx="4"/>
    <!-- Símbolo de cruz médica -->
    <g fill="#0d6efd">
      <rect x="14" y="8" width="4" height="16"/>
      <rect x="8" y="14" width="16" height="4"/>
    </g>
  </svg>
</body>
</html>
